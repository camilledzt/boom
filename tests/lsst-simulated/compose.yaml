name: boom-lsst-simulated

networks:
  boom:

volumes:
  mongodb:

services:
  mongo:
    image: mongo:8.0
    hostname: mongo
    expose:
      - "27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=mongoadmin
      - MONGO_INITDB_ROOT_PASSWORD=mongoadminsecret
    restart: always
    networks:
      - boom
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      start_period: 20s
    volumes:
      - mongodb:/data/db

  mongo-init:
    image: mongo:8.0
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - boom
    volumes:
      - ${BOOM_REPO_ROOT:?Variable not set}/tests/lsst-simulated/mongo-init.sh:/mongo-init.sh
    environment:
      - DB_NAME=boom-lsst-simulated
      - MONGO_INITDB_ROOT_USERNAME=mongoadmin
      - MONGO_INITDB_ROOT_PASSWORD=mongoadminsecret
    entrypoint: ["/bin/bash", "/mongo-init.sh"]

  valkey:
    image: valkey/valkey:7.2.6
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
      - VALKEY_DISABLE_COMMANDS=FLUSHDB,FLUSHALL
    expose:
      - "6379"
    restart: always
    networks:
      - boom
    command: valkey-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  broker:
    image: apache/kafka:4.1.1
    hostname: broker
    ports:
      - "9092:9092"
    expose:
      - "9092"
      - "29092"
    networks:
      - boom
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_NODE_ID: 1
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@broker:29093
      KAFKA_LISTENERS: PLAINTEXT://broker:29092,CONTROLLER://broker:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_NUM_PARTITIONS: 15
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M -XX:+UseG1GC -XX:MaxGCPauseMillis=200"
    healthcheck:
      test: /opt/kafka/bin/kafka-cluster.sh cluster-id --bootstrap-server broker:9092
      interval: 10s

  # One-shot producer: publishes the LSST simulated alerts and exits
  producer:
    image: python:3.13-slim
    hostname: producer
    networks:
      - boom
    depends_on:
      broker:
        condition: service_healthy
    volumes:
      - ${BOOM_REPO_ROOT:?Variable not set}/scripts/produce-lsst-simulated.py:/produce-lsst-simulated.py
      - ${DATA_DIR_HOST:-${BOOM_REPO_ROOT}/data_alex}:/data_alex
    environment:
      - DATA_DIR=/data_alex
      - PRODUCER_LIMIT=${PRODUCER_LIMIT:-0}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        pip install --quiet lsst-alert-packet confluent-kafka numpy pandas && \
        python /produce-lsst-simulated.py --broker broker:29092 --data-dir /data_alex --reset ${PRODUCER_LIMIT:+--limit $PRODUCER_LIMIT}

  add-filter:
    image: boom-astro/boom:latest
    hostname: add-filter
    build:
      dockerfile: ${BOOM_REPO_ROOT:?Variable not set}/Dockerfile
      context: ${BOOM_REPO_ROOT:?Variable not set}
      pull: false
    networks:
      - boom
    entrypoint: ["/app/add_filter", "lsst", "lsst-simulated-filter", "/filter.json"]
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    volumes:
      - ${BOOM_REPO_ROOT:?Variable not set}/tests/lsst-simulated/config.yaml:/app/config.yaml
      - ${FILTER_FILE:-./filter_KN_PRODUCTION.json}:/filter.json:ro

  consumer:
    image: boom-astro/boom:latest
    hostname: consumer
    build:
      dockerfile: ${BOOM_REPO_ROOT:?Variable not set}/Dockerfile
      context: ${BOOM_REPO_ROOT:?Variable not set}
      pull: false
    networks:
      - boom
    command: ["/bin/sh", "-c", "sleep 5 && /app/kafka_consumer lsst --simulated"]
    environment:
      RUST_LOG: debug,ort=error
      BOOM_KAFKA__CONSUMER__LSST__USERNAME: ""
      BOOM_KAFKA__CONSUMER__LSST__PASSWORD: ""
    depends_on:
      producer:
        condition: service_completed_successfully
      broker:
        condition: service_healthy
      valkey:
        condition: service_healthy
      add-filter:
        condition: service_completed_successfully
    volumes:
      - ${BOOM_REPO_ROOT:?Variable not set}/tests/lsst-simulated/config.yaml:/app/config.yaml

  scheduler:
    image: boom-astro/boom:latest
    hostname: scheduler
    build:
      dockerfile: ${BOOM_REPO_ROOT:?Variable not set}/Dockerfile
      context: ${BOOM_REPO_ROOT:?Variable not set}
      pull: false
    command:
      - /app/scheduler
      - lsst
    environment:
      RUST_LOG: debug,ort=error
      BOOM_GPU__ENABLED: "false"
    networks:
      - boom
    depends_on:
      producer:
        condition: service_completed_successfully
      broker:
        condition: service_healthy
      add-filter:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    volumes:
      - ${BOOM_REPO_ROOT:?Variable not set}/tests/lsst-simulated/config.yaml:/app/config.yaml
      - ${BOOM_REPO_ROOT:?Variable not set}/data/models:/app/data/models:ro
      - ${BOOM_REPO_ROOT:?Variable not set}/data/ls_footprint_moc.fits:/app/data/ls_footprint_moc.fits:ro
